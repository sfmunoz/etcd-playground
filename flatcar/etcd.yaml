variant: flatcar
version: 1.0.0

systemd:
 units:
   - name: etcd-member.service
     enabled: true
     dropins:
       - name: 20-clct-etcd-member.conf
         contents: |
           [Service]
           ExecStart=
           ExecStart=/usr/lib/coreos/etcd-wrapper $ETCD_OPTS \
             --trusted-ca-file="/var/lib/etcd/ca.pem" \
             --cert-file="/var/lib/etcd/server.crt" \
             --key-file="/var/lib/etcd/server.key" \
             --peer-trusted-ca-file="/var/lib/etcd/ca.pem" \
             --peer-cert-file="/var/lib/etcd/peers.crt" \
             --peer-key-file="/var/lib/etcd/peers.key" \
             --listen-client-urls="https://localhost:2379" \
             --advertise-client-urls="https://localhost:2379" \
             --listen-peer-urls="https://localhost:2380" \
             --client-cert-auth

storage:
  files:
    - path: /var/lib/etcd/ca.pem
      mode: 0644
      contents:
        inline: |
          -----BEGIN CERTIFICATE-----
          MIIFNDCCAx6gAwIBAgIBATALBgkqhkiG9w0BAQUwLTEMMAoGA1UEBhMDVVNBMRAw
          ...snip...
