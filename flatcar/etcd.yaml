    - path: /root/etcdctl.sh
      mode: 0755
      contents:
        inline: |
          #!/bin/bash
          set -x
          etcdctl --cacert /var/lib/etcd/ca.pem --key /root/cli.key --cert /root/cli.crt put k 1234
          etcdctl --cacert /var/lib/etcd/ca.pem --key /root/cli.key --cert /root/cli.crt get k

passwd:
  users:
  - name: core
    ssh_authorized_keys:
    - "ssh-rsa AAAA..."
